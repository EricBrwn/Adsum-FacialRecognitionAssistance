<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Adsum | Entry Scanner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
    <link rel="stylesheet" href="./css/index.css">
    <script src="face-api.min.js"></script>
    <script src="vendor/xlsx.mini.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/shared.js"></script>
</head>
<body class="scanner-page">

    <header class="scanner-header">
        <h1>Adsum Scanner</h1>
        <p id="scannerMessage">Starting system...</p>
    </header>

    <div id="cameraContainer">
        <video id="camera" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <!-- 🔠 BIG feedback for students (readable from ~2 m away) -->
    <section id="banner" class="banner banner--idle" aria-live="polite">
        <div id="bannerTitle" class="banner__title">Step in front of the camera</div>
        <div id="bannerSubtitle" class="banner__subtitle"></div>
    </section>

    <div id="recentStrip" class="recent-strip"></div>

    <div class="controls-row">
        <label for="cameraSelect">Camera:</label>
        <select id="cameraSelect"></select>
        <button id="openAdminBtn">⚙️ Configure Roll Call</button>
    </div>

    <div id="adminModal">
        <div class="modal-content">
            <h2>Adsum Control Panel</h2>

            <label class="modal-label">👨‍🏫 Teacher Email:</label>
            <div class="teacher-input-row">
                <input type="email" id="teacherEmailInput" placeholder="e.g., profesor@escuela.com">
                <button id="loadGroupsBtn">Load</button>
            </div>

            <label class="modal-label">👥 Group: </label>
            <div style="position: relative; width: 100%;">
                <input type="text" id="modalGroupSearch" placeholder="Search or select a group..." autocomplete="off">
                <input type="hidden" id="hiddenGroupSelect" value="">
                <div id="modalGroupResults" class="dropdown-results"></div>
            </div>

            <label class="modal-label">⏰ Roll Call Time:</label>
            <div class="time-row">
                <div>
                    <label style="font-size: 12px; color: #aaa;">From:</label>
                    <input type="time" id="startTime">
                </div>
                <div>
                    <label style="font-size: 12px; color: #aaa;">To:</label>
                    <input type="time" id="endTime">
                </div>
            </div>

            <label class="modal-label">📝 What session is it?</label>
            <input type="text" id="sessionInput" list="sessionList" placeholder="e.g., Session01, Session03...">
            <datalist id="sessionList"></datalist>

            <label class="checkbox-row">
                <input type="checkbox" id="sendEmailsCheck" checked>
                Email absent students and the teacher
            </label>

            <button id="generateReportBtn">Generate Full Report</button>

            <div id="excelActions" class="excel-actions" style="display:none;">
                <button id="exportExcelBtn">📥 Download Excel</button>
                <button id="syncExcelBtn">☁️ Sync to SharePoint Excel</button>
            </div>

            <button id="closeModalBtn">Close Window</button>

            <div id="reportArea"></div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="./js/index.js"></script>

    <div class="watermark" id="secretAdminBtn" style="pointer-events: auto; cursor: pointer;">
        Project <strong>Adsum</strong> | Developed by <span>EricBrwn</span>
    </div>
</body>
</html>
